name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  pull_request_review_comment:
    types: [created]

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Signature"
        uses: contributor-sign-tool@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIRA_LANGUAGE: English
